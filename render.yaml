# Render Blueprint: runs the Python + FastAPI AI service live.
# Render → New → Blueprint → pick this GitHub repo. The only value Render asks for is your Gemini API key
# (aistudio.google.com → Get API key); the backend address and public key are baked in.
services:
  - type: web
    name: appendus-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: "https://fxzdmdtqnrpgwwcladdm.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_dlLbA5bSSbM0W0JPAF8VDg_2hHCPqXE"
