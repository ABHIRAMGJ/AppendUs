# Render Blueprint: runs the Python + FastAPI AI service live.
# Render → New → Blueprint → pick this GitHub repo. Paste your Gemini API key
# (aistudio.google.com → Get API key) when Render asks for GEMINI_API_KEY.
services:
  - type: web
    name: appendus-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
